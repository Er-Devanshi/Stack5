<!DOCTYPE html>
<html>
<head>
    <title>Sticky Position</title>

    <style>
        .navbar {
            background-color: black;
            color: white;
            padding: 15px;

            position: sticky;
            top: 0;
        }

        .content {
            height: 1000px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        Home | About | Contact
    </div>

    <div class="content">
        <h1>Welcome</h1>
        <p>Scroll down to see the sticky navbar.</p>
    </div>

</body>
</html>3

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .energy-card {
        width: 650px;
        height: 400px;
        left: 10%;
        top: 20%;
        position: relative;
        overflow: hidden;
        border-radius: 28px;

        background: radial-gradient(
          ellipse 100% 80% at center,
          blue 0%,
          rgb(2, 2, 108) 40%,
          blue 70%,
          rgb(2, 2, 108) 100%
        );
      }

      .energy-card h1 {
        color: white;
        text-align: center;
        font-size: 70px;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="energy-card">
      <h1>Serenity</h1>
    </div>
  </body>
</html>

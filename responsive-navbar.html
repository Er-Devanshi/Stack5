<!DOCTYPE html>
<html>
<head>
    <title>Navbar</title>

    <style>

        * {
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .navbar {
            background-color: rgb(6, 2, 27);
            padding: 20px;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 25px;
        }

        .links {
            display: flex;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }
        
    
    </style>
</head>

<body>

    <div class="navbar">

        <div class="container">

            <div class="nav-content">

                <div class="logo">
                    TechNova
                </div>

                <div class="links">
                    <a href="#">Home</a>
                    <a href="#">About</a>
                     <a href="#">Service</a>
                    <a href="#">Contact</a>
                     <a href="#">Login</a>
                </div>

            </div>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    .energy-card {
      width: 650px;
      height: 400px;

      border: 10px solid;
      border-image: linear-gradient(
        
        violet,
        indigo,
        blue,
        green,
        yellow,
        orange,
        red
      ) 1;

      background:radial-gradient(
        rgb(193, 238, 177),
        rgb(243, 243, 125)
      );

      color: white;
      text-align: center;
      font-size: 50px;
      
      
    }
    p{
        color: transparent;
        font-size: 50px;
        font-weight: 900;
        background:linear-gradient(violet,rgb(232, 98, 120));
        background-clip: text;

    }
  </style>
</head>

<body>

  <div class="energy-card">
    <p> SHRISHTI</p>
  </div>
  


</body>
</html>

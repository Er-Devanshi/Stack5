<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazine Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
/* CSS Variables for easy color management */
:root {
  --color-featured: #f2d4e7;
  --color-news: #dbe3f0;
  --color-ad: #d0f0eb;
  --color-article: #fce8cc;
  --color-text: #4a4a4a;
  --border-radius: 8px;
  --gap-size: 15px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: #f8f9fa;
  padding: 20px;
}


.magazine-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 120px);
  gap: var(--gap-size);
  width: 100%;
  max-width: 700px;
  background-color: #ffffff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
}


.card {
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: 700;
  color: var(--color-text);
  border-radius: var(--border-radius);
  letter-spacing: 0.5px;
  text-align: center;
  padding: 10px;
}


.featured {
  grid-column: 1 / 3;
  grid-row: 1 / 3;
  background-color: var(--color-featured);
}

.news1 {
  grid-column: 3;
  grid-row: 1;
  background-color: var(--color-news);
}

.news2 {
  grid-column: 3;
  grid-row: 2;
  background-color: var(--color-news);
}

.ad {
  grid-column: 1;
  grid-row: 3;
  background-color: var(--color-ad);
}

.article {
  grid-column: 2;
  grid-row: 3;
  background-color: var(--color-article);
}

.news3 {
  grid-column: 3;
  grid-row: 3;
  background-color: var(--color-news);
}

</style>


<body>

  <div class="magazine-container">
    <div class="card featured">FEATURED ARTICLE</div>
    <div class="card news1">NEWS 1</div>
    <div class="card news2">NEWS 2</div>
    <div class="card ad">ADVERTISEMENT</div>
    <div class="card article">ARTICLE</div>
    <div class="card news3">NEWS 3</div>
  </div>

</body>
</html>

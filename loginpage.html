<!DOCTYPE html>
<html>
<head>
  <style>
    /* Center everything on the screen */
    body {
      background: linear-gradient(135deg, #e8eaf6);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* White card box */
    .card {
      
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      color: #333;
    }

    label {
      font-size: 14px;
      color: #555;
    }

    /* Input text boxes */
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box; /* keeps padding inside the box */
      background-color: #fafafa;
    }

    /* Purple login button */
    button {
      width: 100%;

      padding: 10px;
      background-color: #6c5ce7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #5b4cc4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Login</h2>
    
    <label>Username</label>
    <input type="text" placeholder=" Enter username">

    <label>Password</label>
    <input type="password" placeholder=" Enter password">

    <button>Login</button>
  </div>

</body>
</html>
